{% extends "admin/base.html" %}
{% block title %}{{ title }} | Lecciones Orales{% endblock %}
{% block branding %}
<div id="site-name"><a href="{% url 'admin:index' %}">{{ site_header }}</a></div>
{% if user.is_staff %}<a class="ir-panel" href="{% url 'lecciones:panel' %}">● Monitoreo en vivo</a>{% endif %}
{% endblock %}
{% block extrastyle %}{{ block.super }}
<style>
  :root, html[data-theme="light"], html[data-theme="dark"] {
    --primary: #c8102e;
    --secondary: #111111;
    --accent: #ffffff;
    --header-color: #f3f3f3;
    --header-branding-color: #ffffff;
    --breadcrumbs-bg: #c8102e;
    --breadcrumbs-fg: #ffe3e8;
    --link-fg: #a50d26;
    --link-hover-color: #111111;
    --link-selected-fg: #c8102e;
    --button-bg: #111111;
    --button-hover-bg: #333333;
    --default-button-bg: #c8102e;
    --default-button-hover-bg: #a50d26;
    --selected-row: #fdecef;
  }
  html[data-theme="dark"] { --link-fg: #ff8fa1; --link-hover-color: #ffffff; --selected-row: #3a1219; }
  .ir-panel { margin-left: 18px; padding: 7px 14px; border-radius: 999px; background: #c8102e; color: #fff !important; font-size: 13px; font-weight: 600; text-decoration: none !important; }
  .ir-panel:hover { background: #a50d26; }
  #header { background: #121212; }
  .module caption, .module h2, .inline-group h2 { background: #121212; }
  .contadores { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 0 18px; }
  .contadores div { flex: 1 1 140px; padding: 14px 18px; border: 1px solid var(--hairline-color); border-radius: 12px; background: var(--darkened-bg); }
  .contadores b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .contadores span { font-size: 12px; color: var(--body-quiet-color); text-transform: uppercase; letter-spacing: .05em; }
</style>
{% endblock %}
